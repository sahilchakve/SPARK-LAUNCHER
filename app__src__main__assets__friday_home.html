<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050608">
<meta name="mobile-web-app-capable" content="yes">
<title>Stark OS · Home Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cy: #29d3ff;
    --am: #ffb020;
    --red: #ff5a5a;
    --txt: #e6f4ff;
    --mut: #7b8fa3;
    --line: rgba(41, 211, 255, 0.25);
    --panel: #0a1420;
    --glass: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #050608;
    color: var(--txt);
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font-family: inherit; color: inherit; }
  button { touch-action: manipulation; }

  .screen-wrap {
    position: relative;
    height: 100vh;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 0%, #15293b 0%, transparent 60%),
      linear-gradient(180deg, #0b1118 0%, #050608 100%);
  }
  .page { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; padding: max(env(safe-area-inset-top), 12px) 14px max(env(safe-area-inset-bottom), 10px); transition: opacity 0.3s, transform 0.35s cubic-bezier(.2,.8,.2,1); }
  .page.hidden { opacity: 0; pointer-events: none; transform: scale(0.98); }

  .wall { position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center; background-repeat: no-repeat; }
  .wall.has-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,6,8,0.35) 0%, rgba(5,6,8,0.75) 100%); }
  .owner { flex: none; margin-top: 4px; }
  .owner-name { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
  .owner-co { font-family: "Share Tech Mono", monospace; font-size: 12px; color: var(--am); letter-spacing: 2px; margin-top: 2px; }

  /* ========== HOME (launcher) ========== */
  .statusbar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--mut); height: 26px; flex: none; }
  .home-clock { font-size: 56px; font-weight: 300; letter-spacing: -1px; margin-top: 6px; flex: none; }
  .home-date { font-size: 14px; color: var(--mut); margin-bottom: 14px; flex: none; }
  .search-pill {
    display: flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 14px;
    background: var(--glass); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px; flex: none;
  }
  .search-pill input { flex: 1; background: transparent; border: none; outline: none; font-size: 16px; }
  .search-pill input::placeholder { color: var(--mut); }
  .tabs { display: flex; justify-content: center; margin: 14px 0; flex: none; }
  .tabs .seg { display: inline-flex; background: var(--glass); border-radius: 999px; padding: 3px; }
  .tabs button { border: none; background: transparent; padding: 7px 18px; border-radius: 999px; font-size: 14px; color: var(--mut); cursor: pointer; }
  .tabs button.on { background: #f2f2f2; color: #111; }

  .apps-area { flex: 1; min-height: 0; overflow-y: auto; padding-right: 18px; scrollbar-width: none; }
  .apps-area::-webkit-scrollbar { display: none; }
  .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 18px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; font-size: 12px; color: var(--txt); }
  .app .ic {
    width: 58px; height: 58px; border-radius: 50%;
    display: grid; place-items: center; font-size: 24px;
    background: #111; border: 2px solid #000;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }
  .app:active .ic { transform: scale(0.93); }
  .app .lbl { max-width: 84px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app.hi .ic { box-shadow: 0 0 0 2px var(--cy), 0 0 18px var(--cy); }

  .folders { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .folder { background: var(--glass); border-radius: 22px; padding: 12px; }
  .folder h4 { font-size: 13px; font-weight: 500; color: var(--mut); margin-bottom: 8px; text-align: center; }
  .folder .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .folder .mini span { height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; background: #111; }

  .alpha {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; font-size: 10px; color: var(--mut); z-index: 3;
  }
  .alpha button { background: none; border: none; color: var(--mut); padding: 1px 4px; cursor: pointer; font-size: 10px; }

  .dock {
    flex: none;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    background: var(--glass); border-radius: 26px;
    padding: 10px 6px; margin-top: 10px;
  }
  .dock .app .ic { width: 50px; height: 50px; font-size: 22px; }
  .dock .app .lbl { display: none; }

  /* ========== HUD (JARVIS) ========== */
  .hud-top { display: flex; justify-content: space-between; align-items: center; height: 44px; flex: none; }
  .brand { color: var(--cy); letter-spacing: 3px; font-size: 15px; font-family: "Share Tech Mono", monospace; }
  .hud-right { display: flex; gap: 8px; align-items: center; }
  .btn-ico {
    position: relative; width: 42px; height: 42px; background: transparent;
    border: 1px solid var(--line); color: var(--cy); font-size: 16px; cursor: pointer; border-radius: 10px;
  }
  .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 4px; background: var(--am); color: #000; font-size: 11px; display: none; align-items: center; justify-content: center; border-radius: 9px; }
  .badge.show { display: flex; }
  .pill-timer { font-family: "Share Tech Mono", monospace; font-size: 12px; color: var(--am); border: 1px solid var(--am); padding: 4px 8px; border-radius: 8px; display: none; }
  .pill-timer.show { display: inline-block; }

  .hud-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .persona-tag { font-family: "Share Tech Mono", monospace; font-size: 12px; letter-spacing: 2px; color: var(--am); }
  .reactor { position: relative; width: 116px; height: 116px; flex: none; display: grid; place-items: center; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed var(--line); animation: spin 26s linear infinite; }
  .ring.r2 { inset: 12px; border: 2px solid rgba(41,211,255,0.35); border-top-color: var(--cy); border-bottom-color: transparent; animation-duration: 9s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .core {
    width: 58px; height: 58px; border-radius: 50%;
    background: radial-gradient(circle, #eaffff 0%, var(--cy) 35%, rgba(41,211,255,0.1) 70%, transparent 72%);
    box-shadow: 0 0 30px var(--cy);
    animation: pulse 2.6s ease-in-out infinite;
  }
  .core.busy { background: radial-gradient(circle, #fff6df 0%, var(--am) 35%, rgba(255,176,32,0.1) 70%, transparent 72%); box-shadow: 0 0 30px var(--am); animation-duration: 0.7s; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  .hud-clock { font-family: "Share Tech Mono", monospace; font-size: 32px; letter-spacing: 3px; text-align: center; }
  .hud-clock small { display: block; font-size: 12px; color: var(--mut); letter-spacing: 2px; margin-top: 2px; }
  .greet { color: var(--am); font-family: "Share Tech Mono", monospace; font-size: 13px; letter-spacing: 1px; }

  .chat { flex: 1; min-height: 0; width: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; overscroll-behavior: contain; }
  .msg { padding: 9px 12px; border: 1px solid var(--line); background: rgba(41,211,255,0.05); font-size: 15px; line-height: 1.45; white-space: pre-wrap; max-width: 88%; word-break: break-word; border-radius: 6px; animation: fade 0.25s ease-out; }
  .msg.friday { border-left: 2px solid var(--cy); align-self: flex-start; }
  .msg.user { border-right: 2px solid var(--am); align-self: flex-end; color: #ffe2a8; background: rgba(255,176,32,0.07); }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; flex: none; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 34px; padding: 0 12px; background: transparent; border: 1px solid var(--line); color: var(--cy); font-family: "Share Tech Mono", monospace; font-size: 13px; border-radius: 17px; cursor: pointer; white-space: nowrap; }
  .chip:active { background: rgba(41,211,255,0.15); }

  .cmd { display: flex; gap: 8px; flex: none; }
  .cmd input { flex: 1; min-width: 0; height: 46px; background: rgba(0,0,0,0.4); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; font-size: 16px; outline: none; }
  .cmd input:focus { border-color: var(--cy); }
  .cmd input::placeholder { color: var(--mut); }
  .send, .mic { height: 46px; min-width: 46px; padding: 0 12px; background: transparent; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-family: "Share Tech Mono", monospace; font-size: 13px; }
  .send { color: var(--am); border-color: rgba(255,176,32,0.5); }
  .mic { color: var(--cy); }
  .mic.live { background: var(--red); border-color: var(--red); color: #fff; }

  .hud-nav { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .hud-nav button { min-height: 48px; background: var(--glass); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; color: var(--txt); font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .hud-nav button span.i { font-size: 17px; color: var(--cy); }

  /* ========== Sheets ========== */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 520px; max-height: 86dvh;
    background: var(--panel); border-top: 1px solid var(--cy);
    border-radius: 18px 18px 0 0;
    padding: 10px 16px max(env(safe-area-inset-bottom), 16px);
    display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto; transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
    overscroll-behavior: contain;
  }
  .overlay.open .sheet { transform: none; }
  .grab { width: 44px; height: 4px; background: var(--line); border-radius: 2px; align-self: center; flex: none; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; color: var(--cy); font-family: "Share Tech Mono", monospace; letter-spacing: 2px; flex: none; }
  .sheet-close { height: 40px; min-width: 40px; background: transparent; border: 1px solid var(--line); color: var(--cy); cursor: pointer; border-radius: 10px; }
  .sbody { display: flex; flex-direction: column; gap: 12px; }

  .btn { min-height: 44px; padding: 0 14px; background: transparent; border: 1px solid var(--line); color: var(--cy); font-size: 14px; cursor: pointer; border-radius: 12px; font-family: "Share Tech Mono", monospace; letter-spacing: 1px; }
  .btn:active { background: rgba(41,211,255,0.15); }
  .btn.amber { color: var(--am); border-color: rgba(255,176,32,0.5); }
  .btn.danger { color: var(--red); border-color: rgba(255,90,90,0.5); }
  .btn.on { background: var(--cy); color: #001018; }
  .btn.sm { min-height: 36px; padding: 0 10px; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.center { justify-content: center; }
  .row input { flex: 1; min-width: 0; height: 44px; background: rgba(0,0,0,0.4); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; font-size: 16px; outline: none; }
  .row input.num { flex: 0 0 90px; }
  .small { font-size: 13px; color: var(--mut); line-height: 1.5; }
  .mono { font-family: "Share Tech Mono", monospace; }

  .list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .list li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.4; }
  .list li > span { flex: 1; word-break: break-word; }
  .list li.done > span { text-decoration: line-through; color: var(--mut); }
  .check { width: 28px; height: 28px; flex: none; border: 1px solid var(--cy); background: transparent; color: var(--cy); cursor: pointer; font-size: 15px; border-radius: 8px; }
  .check.on { background: var(--cy); color: #001018; }

  .kv { display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px dashed var(--line); padding: 8px 0; }
  .kv b { font-weight: normal; color: var(--am); font-family: "Share Tech Mono", monospace; }
  .calc-out { font-size: 40px; color: var(--am); text-align: right; min-height: 52px; word-break: break-all; font-family: "Share Tech Mono", monospace; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .key { height: 56px; background: rgba(41,211,255,0.08); border: 1px solid var(--line); border-radius: 14px; font-size: 20px; cursor: pointer; color: var(--txt); }
  .key.op { color: var(--am); border-color: rgba(255,176,32,0.5); }
  .key:active { background: rgba(41,211,255,0.2); }
  .big-disp { font-size: 56px; text-align: center; color: var(--cy); font-family: "Share Tech Mono", monospace; }
  .persona-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .cam { position: relative; aspect-ratio: 4 / 3; background: #000; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reticle { position: absolute; inset: 18%; border: 2px solid var(--cy); border-radius: 8px; animation: pulse 2.2s ease-in-out infinite; }
  .scanline { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--cy); box-shadow: 0 0 12px var(--cy); animation: scan 3s linear infinite; }
  @keyframes scan { from { top: 0; } to { top: 100%; } }

  .n-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; cursor: pointer; }
  .n-item b { color: var(--am); font-weight: normal; display: block; margin-bottom: 2px; }

  .toast {
    position: fixed; bottom: calc(max(env(safe-area-inset-bottom), 8px) + 96px); left: 50%;
    transform: translateX(-50%); background: var(--panel); border: 1px solid var(--cy);
    padding: 10px 14px; font-size: 13px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 70; max-width: 90vw; text-align: center; border-radius: 12px;
  }
  .toast.show { opacity: 1; }
  body.standby .screen-wrap { filter: brightness(0.2); transition: filter 0.6s; }

  /* ===== JARVIS motion and HUD layer ===== */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 90;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
  }
  @keyframes flicker { 0%,100% { opacity: 0.6; } 50% { opacity: 0.35; } 52% { opacity: 0.75; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); filter: brightness(1.6); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes sweep { to { left: 120%; } }
  @keyframes ripple { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.7); opacity: 0; } }
  @keyframes badgePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,176,32,0.7); } 70% { box-shadow: 0 0 0 8px rgba(255,176,32,0); } }
  @keyframes tapPulse { 0% { box-shadow: 0 0 0 0 var(--cy); } 100% { box-shadow: 0 0 0 18px rgba(41,211,255,0); } }
  @keyframes sheetScan { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @keyframes toastBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes caret { 50% { opacity: 0; } }

  /* Boot sequence */
  #boot {
    position: fixed; inset: 0; z-index: 95; background: #02060b;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    font-family: "Share Tech Mono", monospace; color: var(--cy); letter-spacing: 4px;
    transition: opacity 0.8s, visibility 0.8s;
  }
  #boot.done { opacity: 0; visibility: hidden; }
  #boot .b-ring { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--cy); border-top-color: transparent; border-bottom-color: transparent; animation: spin 1.1s linear infinite; box-shadow: 0 0 18px var(--cy); }
  #boot .b-text { font-size: 14px; animation: flicker 1.2s steps(2) infinite; }
  #boot .b-line { height: 1px; width: 0; background: var(--cy); box-shadow: 0 0 10px var(--cy); animation: grow 1.4s ease-out forwards; }
  #boot .b-sub { font-size: 11px; color: var(--mut); letter-spacing: 2px; }
  @keyframes grow { to { width: 240px; } }

  /* Page transitions: blur-in with a sweep line */
  .page { transition: opacity 0.45s ease, transform 0.55s cubic-bezier(.2,.8,.2,1), filter 0.45s; }
  .page.hidden { opacity: 0; transform: scale(1.02); }
  .page.enter::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 60%;
    background: linear-gradient(90deg, transparent, rgba(41,211,255,0.18), transparent);
    animation: sweep 0.9s ease-out forwards; pointer-events: none; z-index: 2;
  }

  /* Reactor ping on each reply */
  .reactor { position: relative; }
  .reactor.ping::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid var(--cy); box-shadow: 0 0 12px var(--cy);
    animation: ripple 1s ease-out forwards; pointer-events: none;
  }
  .ring { animation-timing-function: linear; }
  .core { animation-duration: 2.6s; }
  
  .hud-clock { text-shadow: 0 0 10px var(--cy); }

  /* Chat messages */
  .msg { animation: rise 0.35s cubic-bezier(.2,.8,.2,1) both; }
  .msg.friday { box-shadow: inset 2px 0 14px -8px var(--cy); }
  .msg.typing::after { content: "▌"; color: var(--cy); animation: caret 0.8s steps(1) infinite; margin-left: 2px; }

  /* Buttons, chips and dock: glow on hover and press */
  .btn, .chip, .btn-ico, .hud-nav button, .key, .check, .sheet-close, .send, .mic {
    transition: box-shadow 0.25s, background 0.25s, color 0.25s, transform 0.15s;
  }
  .btn:hover, .chip:hover, .btn-ico:hover, .hud-nav button:hover, .sheet-close:hover, .send:hover, .mic:hover {
    box-shadow: 0 0 0 1px var(--cy), 0 0 14px rgba(41,211,255,0.45);
  }
  .btn:active, .chip:active, .hud-nav button:active, .key:active { transform: scale(0.96); }
  .hud-nav button { position: relative; overflow: hidden; }
  .hud-nav button::after {
    content: ""; position: absolute; left: -60%; top: 0; bottom: 0; width: 50%;
    background: linear-gradient(90deg, transparent, rgba(41,211,255,0.25), transparent);
    transform: skewX(-20deg); opacity: 0; pointer-events: none;
  }
  .hud-nav button:active::after { opacity: 1; animation: sweep 0.5s ease-out forwards; }

  /* Home icons: rise in, glow and tap pulse */
  .app-grid .app { animation: rise 0.45s cubic-bezier(.2,.8,.2,1) both; }
  .app .ic { transition: box-shadow 0.3s, transform 0.2s; }
  .app:hover .ic { box-shadow: 0 0 0 1px var(--cy), 0 0 16px rgba(41,211,255,0.6); }
  .app:active .ic { animation: tapPulse 0.45s ease-out; }

  /* Sheets: glowing top edge that scans */
  .overlay { }
  .sheet { box-shadow: 0 -12px 40px rgba(41,211,255,0.15); }
  .sheet::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cy), transparent);
    background-size: 200% 100%; animation: sheetScan 2.4s linear infinite;
  }
  .list li, .n-item, .kv, .credit { animation: rise 0.4s cubic-bezier(.2,.8,.2,1) both; }
  .list li:nth-child(2) { animation-delay: 0.04s; }
  .list li:nth-child(3) { animation-delay: 0.08s; }
  .list li:nth-child(4) { animation-delay: 0.12s; }
  .n-item { border-left: 2px solid var(--am); transition: box-shadow 0.25s; }
  .n-item:hover { box-shadow: 0 0 14px rgba(41,211,255,0.3); }
  .credit { font-family: "Share Tech Mono", monospace; font-size: 11px; color: var(--mut); letter-spacing: 2px; text-align: center; margin-top: 6px; }
  .credit b { color: var(--am); font-weight: normal; }

  /* Badge pulse on new notifications */
  .badge.show { animation: badgePulse 1.6s infinite; }

  /* HUD alert (notifications) */
  .toast {
    top: calc(max(env(safe-area-inset-top), 0px) + 14px);
    bottom: auto;
    transform: translate(-50%, -170%);
    transition: transform 0.55s cubic-bezier(.2,.8,.2,1), opacity 0.3s;
    padding: 12px 16px 14px;
    background: rgba(6,18,29,0.93);
    border: 1px solid var(--cy);
    box-shadow: 0 0 18px rgba(41,211,255,0.35);
    text-align: center;
    min-width: 200px;
    position: fixed;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast::before {
    content: "▲ ALERT"; display: block; color: var(--am);
    font-family: "Share Tech Mono", monospace; font-size: 10px; letter-spacing: 3px; margin-bottom: 4px;
  }
  .toast::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
    background: var(--cy); box-shadow: 0 0 8px var(--cy); transform-origin: left;
  }
  .toast.show::after { animation: toastBar 2.2s linear forwards; }

  /* ===== Stark icon system ===== */
  .app .ic {

  /* ===== Device scan panel ===== */

  // Ultimate System: these open the bundled apps full screen inside the launcher
  const FRAME_APPS = [

  const DOCK_IDS = ["phone", "chrome", "gemini", "camera", "jarvis"];

  // ==================== DATA (saved in this browser) ====================

  const $ = id => document.getElementById(id);

    t.classList.add("show");

    toast.h = setTimeout(() => t.classList.remove("show"), 2200);

  function fmtTime(d = new Date()) { return d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }); }

  function pickVoice() {
    if (voiceCache) return voiceCache;
    const vs = speechSynthesis.getVoices();

  function speak(text) {
    if (D.voice === false || !text) return;

    if (!("speechSynthesis" in window)) { toast("Is browser mein voice engine nahi hai"); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.rate = p.rate;
    u.pitch = p.pitch;

    if (v) u.voice = v;
    speechSynthesis.resume();

  // ==================== SAFE CALCULATOR (no eval) ====================
  function evalExpr(src) {
    const s = src.replace(/×/g, "*").replace(/÷/g, "/").replace(/\s+/g, "");
    if (!/^[0-9+\-*/().%^]+$/.test(s) || s === "") throw new Error("bad");
    let pos = 0;
    const peek = () => s[pos];
    function parseExpr() { let v = parseTerm(); while (peek() === "+" || peek() === "-") { const op = s[pos++]; const r = parseTerm(); v = op === "+" ? v + r : v - r; } return v; }
    function parseTerm() { let v = parseFactor(); while (peek() === "*" || peek() === "/" || peek() === "%") { const op = s[pos++]; const r = parseFactor(); v = op === "*" ? v * r : op === "/" ? v / r : v % r; } return v; }
    function parseFactor() { const b = parseUnary(); if (peek() === "^") { pos++; return Math.pow(b, parseFactor()); } return b; }
    function parseUnary() { if (peek() === "-") { pos++; return -parseUnary(); } if (peek() === "+") { pos++; return parseUnary(); } return parseAtom(); }
    function parseAtom() {
      if (peek() === "(") { pos++; const v = parseExpr(); if (peek() !== ")") throw new Error("paren"); pos++; return v; }
      const m = /^\d+(\.\d+)?/.exec(s.slice(pos));
      if (!m) throw new Error("num");
      pos += m[0].length;
      return parseFloat(m[0]);
    }
    const v = parseExpr();
    if (pos !== s.length) throw new Error("extra");
    if (!isFinite(v)) throw new Error("inf");
    return Math.round(v * 1e10) / 1e10;
  }
  function calcReply(expr) {
    try { return `${expr.trim()} = ${evalExpr(expr)}`; }
    catch (e) { return "Ye expression samajh nahi aaya, sir. Example: calc 12*8+4"; }
  }

  // ==================== TIMER, REMINDERS, TASKS ====================
  function startTimer(sec) { D.timer = { endAt: Date.now() + sec * 1000, total: sec }; save(); paintBadges(); if (SHEET === "timer") renderSheet(); }
  function stopTimer() { D.timer = { endAt: null, total: 0 }; save(); paintBadges(); if (SHEET === "timer") renderSheet(); }
  function addReminder(text, sec) { D.reminders.push({ id: Date.now(), text, dueAt: Date.now() + sec * 1000, done: false }); save(); if (SHEET === "reminders") renderSheet(); }
  function addTask(text) { D.tasks.push({ id: Date.now(), text, done: false }); save(); if (SHEET === "tasks") renderSheet(); }
  function tasksText() {
    if (!D.tasks.length) return "Abhi koi task nahi hai, sir.";
    return "Tasks:\n" + D.tasks.map((t, i) => `${i + 1}. [${t.done ? "x" : " "}] ${t.text}`).join("\n");
  }
  function briefing() {
    const pend = D.reminders.filter(r => !r.done).sort((a, b) => a.dueAt - b.dueAt);
    const next = pend[0];
    return [
      `Briefing, sir. ${fmtDate()}, abhi ${fmtTime()}.`,
      `Battery ${SYS.bat === null ? "unknown" : SYS.bat + "%"}, network ${SYS.online ? "online" : "offline"}.`,
      `Pending reminders: ${pend.length}${next ? ` (next: "${next.text}" at ${fmtTime(new Date(next.dueAt))})` : ""}.`,
      `Open tasks: ${D.tasks.filter(t => !t.done).length}.`,
      D.timer.endAt ? `Timer: ${fmtClock(timeLeft())} bacha hai.` : "Timer off hai.",
      "Weather (demo): 27°C, dhoop."
    ].join("\n");
  }
  function evaluateProgress() {
    const total = D.tasks.length, done = D.tasks.filter(t => t.done).length;
    const verdict = total && done === total ? "Sab tasks complete. Impressive, sir." : "Abhi kaafi kaam baaki hai, sir. Shuru kariye.";
    return `Mulyankan: ${done}/${total} tasks complete, ${D.notes.length} notes, ${D.reminders.length} reminders. ${verdict}`;
  }

    if (app.native && window.Android) return Android.launch(app.pkg);

    if (app.action.startsWith("frame:")) return openFrame(app.action.slice(6), app.name);
    if (app.action.startsWith("sheet:")) return openSheet(app.action.split(":")[1]);
    if (app.action.startsWith("url:")) { if (window.Android) Android.openUrl(app.action.slice(4)); else window.open(app.action.slice(4), "_blank", "noopener"); return toast(`${app.name} khul raha hai`); }

  }

  const SHEET_ALIAS = {

  function handle(raw) {
    const t = raw.toLowerCase().trim();
    let m;

    if ((m = t.match(/^time in ([a-z ]+)$/))) {
      const city = m[1].trim();
      if (!CITY_TZ[city]) return "Ye city list mein nahi hai, sir. Tokyo, London, New York, Dubai, Sydney, Paris, Singapore, Mumbai bol sakte hain.";
      const time = new Date().toLocaleTimeString("en-IN", { timeZone: CITY_TZ[city], hour: "numeric", minute: "2-digit" });
      return `${city.replace(/\b\w/g, c => c.toUpperCase())} mein abhi ${time} hain, sir.`;
    }
    if ((m = t.match(/^convert\s+([\d.]+)\s*([a-z]+)\s+(?:to\s+)?([a-z]+)$/))) {
      const out = convertUnits(parseFloat(m[1]), m[2], m[3]);
      if (out === null) return "Ye unit conversion support nahi hai, sir. km, m, cm, mi, kg, g, lb, c, f try kariye.";
      return `${m[1]} ${m[2]} = ${Math.round(out * 1e6) / 1e6} ${m[3]}`;
    }
    if (/^(flip( a)? coin|coin)$/.test(t)) return Math.random() < 0.5 ? "Heads, sir." : "Tails, sir.";
    if (/^(roll )?dice$/.test(t)) return `Dice: ${1 + Math.floor(Math.random() * 6)}, sir.`;
    if ((m = t.match(/^password(?:\s+(\d+))?$/))) {
      const len = Math.min(64, Math.max(8, +(m[1] || 16)));
      return `Password (${len}): ${genPassword(len)}`;
    }
    if (/^quote$/.test(t)) return QUOTES[Math.floor(Math.random() * QUOTES.length)];
    if ((m = raw.match(/^find note\s+(.+)$/i))) {
      const q = m[1].trim().toLowerCase();
      const hits = D.notes.filter(n => n.toLowerCase().includes(q));
      return hits.length ? "Mil gaye:\n" + hits.slice(0, 8).map((n, i) => `${i + 1}. ${n}`).join("\n") : "Is naam ka koi note nahi mila, sir.";
    }
    if (/^clear (done )?tasks$/.test(t)) {
      const before = D.tasks.length;
      D.tasks = D.tasks.filter(x => !x.done);
      save();
      if (SHEET === "tasks") renderSheet();
      return `${before - D.tasks.length} completed task hata diye, sir.`;
    }
    if (/^stopwatch start$/.test(t)) { D.sw = Date.now(); save(); return "Stopwatch start, sir."; }
    if ((m = t.match(/^stopwatch(?: (stop|lap))?$/))) {
      if (!D.sw) return "Stopwatch chal nahi raha, sir. 'stopwatch start' likhiye.";
      const secs = ((Date.now() - D.sw) / 1000).toFixed(1);
      if (m[1] === "stop") { D.sw = null; save(); return `Stopwatch stop: ${secs} sec, sir.`; }
      return m[1] === "lap" ? `Lap: ${secs} sec, sir.` : `Stopwatch: ${secs} sec chal raha hai.`;
    }
    if ((m = t.match(/^days (?:to|until) (\d{4}-\d{2}-\d{2})$/))) {
      const diff = Math.ceil((new Date(m[1] + "T00:00:00") - Date.now()) / 86400000);
      if (isNaN(diff)) return "Date sahi format mein likhiye, jaise 2027-01-01.";
      return diff >= 0 ? `${diff} din baaki hain, sir.` : `Ye date ${-diff} din pehle nikal chuki hai, sir.`;
    }
    if ((m = t.match(/^random (-?\d+) (-?\d+)$/))) {
      let lo = +m[1], hi = +m[2];
      if (hi < lo) [lo, hi] = [hi, lo];
      return `Random: ${lo + Math.floor(Math.random() * (hi - lo + 1))}, sir.`;
    }
    if ((m = raw.match(/^habit add\s+(.+)$/i))) {
      const n = m[1].trim().toLowerCase();
      D.habits[n] = D.habits[n] || [];
      save();
      return `Habit add ho gayi: ${n}, sir.`;
    }
    if ((m = raw.match(/^habit done\s+(.+)$/i))) {
      const n = m[1].trim().toLowerCase();
      if (!D.habits[n]) return "Ye habit nahi mili, sir. Pehle 'habit add' karein.";
      if (!D.habits[n].includes(today())) D.habits[n].push(today());
      save();
      return `${n}: done. Streak ${streakOf(D.habits[n])} din, sir.`;
    }
    if (/^habits$/.test(t)) {
      const names = Object.keys(D.habits);
      if (!names.length) return "Koi habit nahi hai, sir. 'habit add water' se shuru kariye.";
      return "Habits:\n" + names.map(n =>
        `• ${n}: streak ${streakOf(D.habits[n])} din${D.habits[n].includes(today()) ? " ✓" : ""}`).join("\n");
    }
    if ((m = t.match(/^(?:spent|kharch)\s+(\d+(?:\.\d+)?)\s+(?:on\s+)?(.+)$/))) {
      D.expenses.push({ amt: +m[1], note: m[2].trim(), d: today() });
      save();
      return `Noted: Rs ${m[1]} on ${m[2].trim()}, sir.`;
    }
    if (/^expenses$/.test(t)) {
      const weekAgo = dayKey(new Date(Date.now() - 6 * 86400000));
      const sumToday = D.expenses.filter(e => e.d === today()).reduce((a, e) => a + e.amt, 0);
      const sumWeek = D.expenses.filter(e => e.d >= weekAgo).reduce((a, e) => a + e.amt, 0);
      const last = D.expenses.slice(-5).map(e => `• Rs ${e.amt} ${e.note}`).join("\n");
      return `Aaj: Rs ${sumToday}. Is hafte: Rs ${sumWeek}.` + (last ? "\n" + last : "");
    }
    if ((m = t.match(/^remind(?:er)? every\s+(\d+)\s*(min|mins|minute|minutes|m|hour|hours|hr|h)\s+(.+)$/))) {
      const n = +m[1];
      const isHour = /^h/.test(m[2]);
      const ms = isHour ? n * 3600000 : n * 60000;
      D.repeats.push({ id: Date.now(), text: m[3].trim(), everyMs: ms, nextAt: Date.now() + ms });
      save();
      return `Har ${n} ${isHour ? "ghante" : "minute"} mein yaad dilaunga: ${m[3].trim()}, sir.`;
    }
    if (/^stop repeats?$/.test(t)) { D.repeats = []; save(); return "Repeat reminders band kar diye, sir."; }
    if ((m = raw.match(/^bookmark\s+(https?:\/\/\S+)$/i))) {
      D.bookmarks.push(m[1]);
      save();
      return `Bookmark save: ${m[1]}`;
    }
    if (/^bookmarks$/.test(t)) {
      return D.bookmarks.length
        ? "Bookmarks:\n" + D.bookmarks.map((b, i) => `${i + 1}. ${b}`).join("\n") + "\n'bookmark 1' likh kar kholiye."
        : "Koi bookmark nahi hai, sir.";
    }
    if ((m = t.match(/^bookmark (\d+)$/))) {
      const b = D.bookmarks[+m[1] - 1];
      if (!b) return "Ye bookmark nahi mila, sir.";
      openLink(b);
      return "Khol raha hoon, sir.";
    }
    if ((m = raw.match(/^journal\s+(.+)$/i))) {
      D.journal.push({ d: today(), t: fmtTime(), text: m[1].trim() });
      save();
      return "Journal entry save ho gayi, sir.";
    }
    if (/^journal$/.test(t)) {
      return D.journal.length ? D.journal.slice(-5).map(j => `${j.d} ${j.t}: ${j.text}`).join("\n") : "Journal khaali hai, sir.";
    }
    if ((m = t.match(/^tip\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)%?$/))) {
      const tip = +m[1] * +m[2] / 100;
      return `Tip: Rs ${round2(tip)}, total Rs ${round2(+m[1] + tip)}.`;
    }
    if ((m = t.match(/^split\s+(\d+(?:\.\d+)?)\s+(?:among\s+)?(\d+)$/))) {
      if (+m[2] <= 0) return "Log ki sankhya 1 ya usse zyada honi chahiye, sir.";
      return `Har vyakti ka hissa: Rs ${round2(+m[1] / +m[2])} (${m[2]} log).`;
    }
    if ((m = t.match(/^(\d+(?:\.\d+)?)\s*%\s+of\s+(\d+(?:\.\d+)?)$/))) {
      return `${m[1]}% of ${m[2]} = ${round2(+m[1] * +m[2] / 100)}`;
    }
    if ((m = t.match(/^(?:sqrt|square root of)\s+(\d+(?:\.\d+)?)$/))) {
      return `Square root: ${Math.round(Math.sqrt(+m[1]) * 1e6) / 1e6}`;
    }
    if ((m = raw.match(/^(?:count|word count)\s+(.+)$/i))) {
      return `Words: ${m[1].trim().split(/\s+/).length}, characters: ${m[1].length}.`;
    }
    if ((m = raw.match(/^reverse\s+(.+)$/i))) return [...m[1]].reverse().join("");
    if ((m = raw.match(/^morse\s+(.+)$/i))) return `Morse: ${toMorse(m[1])}`;

    if ((m = raw.match(/^(?:ask|ai)\s+(.+)$/i))) { aiPending(m[1]); return null; }
    if ((m = t.match(/^(?:mode|switch to|be|become)\s+(friday|jarvis|edith|dume|dum-e|ultron|u)$/))) {
      setPersona(m[1] === "dum-e" ? "dume" : m[1] === "u" ? "ultron" : m[1]);
      return null;
    }
    if (/^mode$/.test(t)) return "Modes: friday, jarvis, edith, dume, ultron. Example: mode jarvis";
    if (/^(hi|hello|hey|hii+|namaste|yo)\b/.test(t)) return P().greet(greetWord());
    if (/\b(help|madad|commands)/.test(t)) return HELP;
    if (/\b(who are you|tum kaun|kaun ho)\b/.test(t)) return `Main ${P().name} hoon, sir. Aapka personal assistant.`;
    if (/\b(thanks|thank you|shukriya)\b/.test(t)) return "Hamesha sir. Kuch aur?";
    if (/\b(kitne baje|time|samay|baje)\b/.test(t)) return `Abhi ${fmtTime()} baje hain, sir.`;
    if (/\b(date|tareekh|aaj kya hai|today)\b/.test(t)) return `Aaj ${fmtDate()} hai.`;
    if (/\b(briefing|brief)\b/.test(t)) return briefing();
    if (/^(device scan|scan device|diagnose|diagnostics|hardware)$/.test(t)) { openSheet("scan"); return deviceReport(getDeviceData()); }
    if (/\b(scan|vision|camera)\b/.test(t)) { openSheet("vision"); return "EDITH vision khul gaya, sir. START CAMERA dabayein."; }
    if (/^evaluate$|mulyankan/.test(t)) return evaluateProgress();
    if (/\bcoffee\b/.test(t)) return D.persona === "dume" ? "DUM-E coffee laane gaya... aur rasta mein gira diya. Sorry sir." : "Coffee abhi virtual hai, sir. Break le lijiye.";
    if (/^pomodoro$/.test(t)) { startTimer(1500); return "Pomodoro shuru: 25 min focus, sir."; }

    if ((m = t.match(/^(?:set )?timer\s+(\d+)\s*(sec|secs|second|seconds|s|min|mins|minute|minutes|m)?$/))) {
      const n = +m[1], sec = /^s/.test(m[2] || "") ? n : n * 60;
      if (sec <= 0) return "Timer kam se kam 1 second ka hona chahiye, sir.";
      startTimer(sec);
      return `Timer set: ${fmtDur(sec)}, sir.`;
    }
    if ((m = t.match(/remind(?:er)?\s+(?:me\s+)?(?:to\s+)?(.+?)\s+in\s+(\d+)\s*(sec|secs|second|seconds|s|min|mins|minute|minutes|m|hour|hours|hr|hrs|h)?$/))) {
      const n = +m[2], unit = m[3] || "min";
      const sec = /^s/.test(unit) ? n : /^h/.test(unit) ? n * 3600 : n * 60;
      addReminder(m[1], sec);
      return `Theek hai sir, ${fmtDur(sec)} baad yaad dilaunga: ${m[1]}.`;
    }

    if (/^tasks?$/.test(t)) return tasksText();
    if ((m = raw.match(/^(?:add task|task|naya task)\s*:?\s+(.+)$/i))) { addTask(m[1].trim()); return `Task add ho gaya: ${m[1].trim()}`; }
    if ((m = t.match(/^done\s+(\d+)$/))) {
      const task = D.tasks[+m[1] - 1];
      if (!task) return "Ye task number nahi mila, sir.";
      task.done = !task.done; save();
      if (SHEET === "tasks") renderSheet();
      return task.done ? `Done: ${task.text}. Badhiya, sir.` : `Wapas open: ${task.text}`;
    }
    if ((m = t.match(/^(?:delete|remove) task\s+(\d+)$/))) {
      const idx = +m[1] - 1;
      if (!D.tasks[idx]) return "Ye task number nahi mila, sir.";
      const removed = D.tasks.splice(idx, 1)[0]; save();
      if (SHEET === "tasks") renderSheet();
      return `Task hata diya: ${removed.text}`;
    }

    if (/^(show |mere |my )?notes$/.test(t)) {
      return D.notes.length ? "Aapke notes:\n" + D.notes.slice(0, 8).map((n, i) => `${i + 1}. ${n}`).join("\n") : "Abhi koi note nahi hai, sir.";
    }
    if ((m = raw.match(/^(?:note|likho|likh do)\s*:?\s+(.+)$/i))) {
      D.notes.unshift(m[1].trim()); save();
      if (SHEET === "notes") renderSheet();
      return "Note save ho gaya, sir.";
    }

    if ((m = raw.match(/^(?:calc|calculate|hisaab)\s+(.+)$/i))) return calcReply(m[1]);
    if (/^[\d\s()+\-*/.^%×÷]+$/.test(t) && /\d/.test(t) && /[+\-*/^%×÷]/.test(t)) return calcReply(raw);

    if (/\b(weather|mausam|taapman)\b/.test(t)) return "Demo mode: 27°C, halki hawa, dhoop. Asli mausam ke liye weather API chahiye, sir.";
    if (/\b(status|system|battery|diagnostic)\b/.test(t)) {
      return `Battery: ${SYS.bat === null ? "unknown" : SYS.bat + "%"}. Network: ${SYS.online ? "online" : "offline"}. ` +
             `Session: ${Math.round((Date.now() - SESSION_START) / 60000)} min. Pending reminders: ${D.reminders.filter(r => !r.done).length}.`;
    }

    if ((m = t.match(/^open\s+(.+)$/))) {
      const name = m[1].trim();
      const app = APPS.find(a => a.name.toLowerCase() === name) || APPS.find(a => a.name.toLowerCase().includes(name))
        || APPS.find(a => a.id === name.replace(/\s+/g, ""));
      if (app) { launchApp(app); return `${app.name} khol raha hoon, sir.`; }
      const sid = SHEET_ALIAS[name];
      if (sid) { openSheet(sid); return `${SHEETS[sid].title} khol diya, sir.`; }
      return "Ye app ya module nahi mila. App ka naam bolein, jaise 'open chrome'.";
    }

    if ((m = t.match(/^voice (on|off)$/))) { D.voice = m[1] === "on"; save(); return `Voice ${D.voice ? "on" : "off"} ki gayi, sir.`; }
    if (/\b(joke|mazaak)\b/.test(t)) return JOKES[Math.floor(Math.random() * JOKES.length)];
    if (/\b(motivat|himmat|inspire)\b/.test(t)) return "Sir, progress roz thodi-thodi hoti hai. Aaj ka ek kaam poora karein.";
    if (/^clear( chat)?$/.test(t)) { D.chat = []; save(); paintChat(); return "Chat saaf kar di, sir."; }
    if (/^(standby|sleep)$/.test(t)) { document.body.classList.add("standby"); return "Standby on, sir. Wapas ke liye 'wake' likhiye."; }
    if (/^wake$/.test(t)) { document.body.classList.remove("standby"); return "Wapas aa gaye, sir."; }

    if (D.apiKey) { aiPending(raw); return null; }
    return `Samajh nahi aaya, sir. "help" likhiye.`;
  }

  function renderCalc(body) {
    body.innerHTML = `<div class="calc-out" id="c-out"></div><div class="keys" id="c-keys"></div>`;
    const keys = ["C","÷","×","−","7","8","9","+","4","5","6","=","1","2","3","","0","."];
    const box = body.querySelector("#c-keys");
    keys.forEach(k => {
      if (k === "") { box.appendChild(document.createElement("span")); return; }
      const b = document.createElement("button");
      b.className = "key" + ("÷×−+=".includes(k) ? " op" : "");

  function calcPress(k) {
    const c = calcState;
    if (/^\d$/.test(k)) { if (c.fresh) { c.display = k; c.fresh = false; } else c.display = c.display === "0" ? k : c.display + k; }
    else if (k === ".") { if (c.fresh) { c.display = "0."; c.fresh = false; } else if (!c.display.includes(".")) c.display += "."; }
    else if (k === "C") Object.assign(c, { display: "0", prev: null, op: null, fresh: true });
    else if (k === "=") { applyCalc(); c.fresh = true; }
    else { if (c.op && !c.fresh) applyCalc(); c.prev = parseFloat(c.display); c.op = k; c.fresh = true; }
  }
  function applyCalc() {
    const c = calcState, a = c.prev, b = parseFloat(c.display);
    if (c.op === null || a === null || isNaN(b)) return;
    let r;
    switch (c.op) { case "+": r = a + b; break; case "−": r = a - b; break; case "×": r = a * b; break; case "÷": r = b === 0 ? NaN : a / b; break; }
    c.display = isFinite(r) ? String(Math.round(r * 1e10) / 1e10) : "Error";
    c.prev = null; c.op = null;
  }
  function paintCalc() { const el = $("c-out"); if (el) el.textContent = calcState.display; }

  function chatHistory(question) {
    let turns = D.chat.slice(-12)
      .filter(m => m.text && m.text.trim())
      .map(m => ({ role: m.who === "user" ? "user" : "assistant", content: m.text }));
    while (turns.length && turns[0].role !== "user") turns.shift();
    const merged = [];
    turns.forEach(t => {
      const last = merged[merged.length - 1];
      if (last && last.role === t.role) last.content += "\n" + t.content;
      else merged.push({ ...t });
    });
    if (!merged.length) merged.push({ role: "user", content: question });
    return merged;
  }

  async function askAI(question) {
    const persona = P();
    const history = chatHistory(question);
    const system = `You are ${persona.name}, a JARVIS-style personal assistant for sir (the user). ` +
      `Reply in short Hinglish (Hindi-English mix) unless the user writes in English. ` +
      `Address the user as "sir". Be concise, witty, and honest.`;
    const model = D.apiModel || AI_DEFAULTS[D.apiProvider || "anthropic"];

    if (D.apiProvider === "gemini") {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method: "POST",
        headers: { "content-type": "application/json", "x-goog-api-key": D.apiKey },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: system }] },
          contents: history.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })),
          generationConfig: { maxOutputTokens: 400 }
        })
      });
      if (!res.ok) throw new Error("status " + res.status);
      const data = await res.json();
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      return parts.map(p => p.text || "").join("").trim() || "Jawab khali aaya, sir.";
    }

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": D.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({ model, max_tokens: 400, system, messages: history })
    });
    if (!res.ok) throw new Error("status " + res.status);
    const data = await res.json();
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("").trim();
    return text || "Jawab khali aaya, sir.";
  }

  let micOn = false;

  function setMicUI(on) { $("mic").classList.toggle("live", on); }

  function startMic() {
    micOn = true;
    setMicUI(true);
    if (window.Android && Android.startListening) { Android.startListening(); return; }
    const SRx = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SRx) { toast("Voice is browser mein nahi hai"); micOn = false; setMicUI(false); return; }
    browserRec = new SRx();
    browserRec.lang = "en-IN";
    browserRec.continuous = true;
    browserRec.interimResults = false;
    browserRec.onresult = e => {
      const r = e.results[e.results.length - 1];
      if (r.isFinal) onVoiceResult(r[0].transcript);
    };
    browserRec.onend = () => { if (micOn && browserRec) { try { browserRec.start(); } catch (err) {} } };
    try { browserRec.start(); } catch (err) {}
  }
  function stopMic() {
    micOn = false;
    setMicUI(false);
    if (window.Android && Android.stopListening) Android.stopListening();
    if (browserRec) { const r = browserRec; browserRec = null; r.onend = null; try { r.stop(); } catch (err) {} }
  }
  window.onVoiceState = s => {
    if (s === "denied") { toast("Mic permission nahi mili, sir"); micOn = false; setMicUI(false); }
    if (s === "unavailable") { toast("Voice service is phone par nahi hai"); micOn = false; setMicUI(false); }

  function mediaCmd(c) {
    if (window.Android && Android.mediaControl) { Android.mediaControl(c); toast(`Media: ${c}`); }
    else toast("Media control sirf APK mein chalta hai");
  }
  function onVoiceResult(text) {
    const t = (text || "").trim();
    if (!t) return;
    if (/^(keyboard|type)$/i.test(t)) return openKeyboard("");
    let m = t.match(/^type\s+(.+)$/i);
    if (m) return openKeyboard(m[1]);
    if (/^send$/i.test(t)) { const v = $("cmd").value; $("cmd").value = ""; return submit(v); }
    if (/^(play|resume)$/i.test(t)) return mediaCmd("play");
    if (/^(pause|stop music)$/i.test(t)) return mediaCmd("pause");
    if (/^(next|skip)( song| track)?$/i.test(t)) return mediaCmd("next");
    if (/^(previous|back)( song| track)?$/i.test(t)) return mediaCmd("prev");
    if (/^volume up$/i.test(t)) return mediaCmd("volup");
    if (/^volume down$/i.test(t)) return mediaCmd("voldown");
    m = t.match(/^tap\s+(.+)$/i);
    submit(m ? "open " + m[1] : t);
  }
  window.onVoiceResult = onVoiceResult;

  function escHtml(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  let liveTimer = null;
  function showLive(kind, label, title, text) {
    const c = $("live-card");
    c.className = "live-card show " + kind;
    c.innerHTML = `<b>${escHtml(label)}</b><div class="lc-title">${escHtml(title)}</div><div class="lc-text">${escHtml(text)}</div>`;
    c.onclick = () => c.classList.remove("show");
    clearTimeout(liveTimer);
    if (kind !== "call") liveTimer = setTimeout(() => c.classList.remove("show"), 5000);
  }
  window.onNativeEvent = ev => {
    if (!ev || !ev.type) return;
    if (ev.type === "call") {
      showLive("call", "INCOMING CALL", ev.title || "Unknown", ev.app || "");
      speak(`Sir, call aa rahi hai, ${ev.title || "unknown"}.`);
    } else if (ev.type === "callEnd") {
      const c = $("live-card");
      if (c.classList.contains("call")) c.classList.remove("show");
    } else if (ev.type === "notif") {
      showLive("notif", String(ev.app || "NOTIFICATION").toUpperCase(), ev.title || "", ev.text || "");
      D.notifs.unshift({ title: ev.title || ev.app || "Notification", body: ev.text || "", target: "notifs", t: Date.now() });
      D.notifs = D.notifs.slice(0, 30);
      save();
      paintBadges();
    }
  };

  function pollMedia() {
    const el = $("np");
    if (!el || !(window.Android && Android.mediaInfo)) return;
    let m = null;
    try { m = JSON.parse(Android.mediaInfo()); } catch (e) {}
    if (m && m.title) {
      el.textContent = (m.playing ? "▶ " : "❚❚ ") + m.title + (m.artist ? " · " + m.artist : "");
      el.classList.add("show");
    } else {
      el.textContent = "";
      el.classList.remove("show");
    }
  }

  function appendNative(body) {
    const sec = document.createElement("div");
    sec.style.cssText = "display:flex;flex-direction:column;gap:10px";
    const access = !!(window.Android && Android.hasNotifAccess && Android.hasNotifAccess());
    sec.innerHTML = `
      <div class="small">VOICE, NOTIFICATIONS, MEDIA</div>
      <div class="kv"><span>Notification access</span><b>${window.Android ? (access ? "ON" : "OFF") : "APK only"}</b></div>
      <div class="row center">
        <button class="btn" id="n-access">NOTIFICATION ACCESS</button>
        <button class="btn amber" id="n-mic">${micOn ? "MIC OFF" : "MIC ON"}</button>
      </div>
      <div class="small">Notification access on karne par calls aur notifications HUD mein aayenge aur music control hoga. MIC ON karne par wo tab tak sunta rahega jab tak aap OFF na karein.</div>`;
    sec.querySelector("#n-access").addEventListener("click", () => { if (window.Android && Android.openNotifAccess) Android.openNotifAccess(); });
    sec.querySelector("#n-mic").addEventListener("click", () => { toggleMic(); renderSheet(); });
    body.appendChild(sec);
  }

  // ==================== INIT ====================
  const nat = nativeApps();
  if (nat) APPS = nat;
  applyPersona();
  renderHomeGrid();
  renderAlpha();
  renderDock();
  renderChips();
  paintChat();
  paintBadges();
  showPage(D.page === "hud" ? "hud" : "home");
  tick();
  setInterval(tick, 1000);
  setTimeout(() => $("boot").classList.add("done"), 1800);
  setInterval(pollMedia, 4000);
  if (!D.chat.length) say(P().greet(greetWord()));
</script>
